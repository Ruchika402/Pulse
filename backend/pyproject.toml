[project]
name = "pulse-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruchika", email = "adakruchika5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.7.0",
    "channels~=4.0",
    "channels-redis>=4.3.0",
    "cryptography>=50.0.2",
    "django~=5.2",
    "django-cors-headers>=4.9.0",
    "django-csp>=4.0",
    "django-environ>=0.14.0",
    "django-prometheus>=2.5.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.9",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
pulse-backend = "pulse_backend:main"


[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
