name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pulse_ci
          POSTGRES_PASSWORD: pulse_ci_password
          POSTGRES_DB: pulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          enable-cache: true
          
      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Django check
        env:
          SECRET_KEY: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://pulse_ci:pulse_ci_password@localhost:5432/pulse_ci
          REDIS_URL: redis://localhost:6379/0
        run: uv run python manage.py check

      - name: Check for missing migrations
        env:
          SECRET_KEY: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://pulse_ci:pulse_ci_password@localhost:5432/pulse_ci
          REDIS_URL: redis://localhost:6379/0
        run: uv run python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
